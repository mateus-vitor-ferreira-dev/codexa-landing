# O site é estático: o que muda com o tempo (hoje só o lastmod do sitemap; o número de
# projetos ficou fixo em src/lib/numeros.ts) só se atualiza num build novo. Este agendamento pede um build ao Cloudflare todo dia, pelo deploy hook
# do Workers Builds.
#
# Configurar uma vez: no painel do Cloudflare, Worker "codexa-landing" → Settings →
# Builds → Deploy Hooks, crie um hook da branch de produção e guarde a URL no segredo
# CLOUDFLARE_DEPLOY_HOOK do repositório (Settings → Secrets and variables → Actions).
name: Rebuild diário

on:
  schedule:
    - cron: "10 3 * * *" # 00:10 em Brasília
  workflow_dispatch: # para pedir um build na hora, pela aba Actions

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir um build ao Cloudflare
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::Segredo CLOUDFLARE_DEPLOY_HOOK não configurado; nada a fazer."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
